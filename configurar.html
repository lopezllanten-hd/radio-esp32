<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Configurar Radio ESP32</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 420px; margin: 0 auto; padding: 16px; }
  button, input { width: 100%; padding: 12px; margin: 6px 0; font-size: 16px; box-sizing: border-box; }
  #estado { padding: 10px; background: #eee; border-radius: 8px; min-height: 1.4em; }
</style>
</head>
<body>
<h2>Radio ESP32</h2>
<button id="btnConectar">1. Buscar y conectar por Bluetooth</button>
<input id="ssid" placeholder="Nombre de la red (SSID)" disabled>
<input id="clave" type="password" placeholder="Clave" disabled>
<button id="btnEnviar" disabled>2. Enviar red al ESP32</button>
<button id="btnBorrar" disabled>Borrar redes guardadas</button>
<p>Estado del ESP32:</p>
<div id="estado">Sin conexión</div>

<script>
const SVC = "7a1c0001-5b1e-4c3a-9d2e-0a1b2c3d4e5f";
const CFG = "7a1c0002-5b1e-4c3a-9d2e-0a1b2c3d4e5f";
const STA = "7a1c0003-5b1e-4c3a-9d2e-0a1b2c3d4e5f";
let cfgChar = null;
const $ = id => document.getElementById(id);
const estado = t => $("estado").textContent = t;

$("btnConectar").onclick = async () => {
  try {
    const dev = await navigator.bluetooth.requestDevice({ filters: [{ services: [SVC] }] });
    estado("Conectando…");
    const server = await dev.gatt.connect();
    const svc = await server.getPrimaryService(SVC);
    cfgChar = await svc.getCharacteristic(CFG);
    const sta = await svc.getCharacteristic(STA);
    await sta.startNotifications();
    sta.addEventListener("characteristicvaluechanged", e =>
      estado(new TextDecoder().decode(e.target.value)));
    dev.addEventListener("gattserverdisconnected", () => {
      estado("Bluetooth desconectado");
      ["ssid", "clave", "btnEnviar", "btnBorrar"].forEach(i => $(i).disabled = true);
    });
    ["ssid", "clave", "btnEnviar", "btnBorrar"].forEach(i => $(i).disabled = false);
    estado("Conectado por Bluetooth");
  } catch (err) { estado("Error: " + err.message); }
};

$("btnEnviar").onclick = async () => {
  try {
    const txt = $("ssid").value + "\n" + $("clave").value;
    await cfgChar.writeValueWithResponse(new TextEncoder().encode(txt));
    estado("Enviado, esperando respuesta…");
  } catch (err) { estado("Error: " + err.message); }
};

$("btnBorrar").onclick = async () => {
  try {
    await cfgChar.writeValueWithResponse(new TextEncoder().encode("CLEAR"));
  } catch (err) { estado("Error: " + err.message); }
};
</script>
</body>
</html>
